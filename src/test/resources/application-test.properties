# RabbitMQ test configuration
spring.rabbitmq.listener.simple.auto-startup=true

#Disable cron job for testing
reitti.imports.schedule=-
reitti.import.grace-time-seconds=0
logging.level.root = INFO
logging.level.com.dedicatedcode.reitti = DEBUG
logging.level.com.dedicatedcode.reitti.service.processing.UnifiedLocationProcessingService = TRACE
logging.level.com.dedicatedcode.reitti.service.jobs.JobSchedulingService = TRACE


reitti.h3.enabled=true

my.h3.tmp.dir=${java.io.tmpdir}/reitti-h3-test-db-${random.uuid}

# Use the defined directory for the H3 service
reitti.h3.root-dir=${my.h3.tmp.dir}
reitti.h3.tmp-zip-path=${my.h3.tmp.dir}/h3-test-db.zip

