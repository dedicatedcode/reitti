# Data management configuration
reitti.data-management.enabled=true
# Enable hostname verification before deleting all data (true/false)
reitti.data-management.delete-all.hostname-verification.enabled=false

logging.level.com.dedicatedcode.reitti=DEBUG
logging.level.com.dedicatedcode.reitti.service.processing.UnifiedLocationProcessingService = TRACE
logging.level.com.dedicatedcode.reitti.controller.api.LocationDataApiController = TRACE

reitti.geocoding.photon.base-url=http://localhost:2322

reitti.import.batch-size=10000

spring.thymeleaf.cache=false

reitti.server.advertise-uri=http://localhost:8080

reitti.ui.tiles.cache.url=http://localhost:8084

reitti.security.oidc.enabled=false
reitti.security.oidc.registration.enabled=true
reitti.security.local-login.disable=false

reitti.process-data.refresh-views.schedule=0 * * * * *

reitti.storage.path=data/

reitti.h3.enabled=true

# Local H3 bundle testing: manifest is served from a local HTTP server, e.g.
#   cd paikka/data && python3 -m http.server 8899 --bind 127.0.0.1
# The bundle is expected unpacked under <path>/h3-index/version_<version>.
#reitti.h3.path=${user.home}/reitti-h3-new
#reitti.h3.manifest-url=http://localhost:8899/manifest.json

#server.servlet.context-path=/reitti

#reitti.panoramax.base-url=

spring.data.redis.username=reitti
spring.data.redis.password=reitti
spring.data.redis.database=0
spring.cache.redis.key-prefix=reitti: