<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{statistics.page.title}">Statistics - Reitti</title>
    <link rel="icon" th:href="@{/img/logo-64x64.png}">
    <link rel="apple-touch-icon" th:href="@{/img/logo.svg}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/img/logo-64x64.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/lineicons.css}">
    <script th:src="@{/js/vendor/htmx.min.js}"></script>
    <script th:src="@{/js/csrf.js(v=${appVersion})}"></script>
    <script th:src="@{/js/util.js(v=${appVersion})}"></script>
    <script th:inline="javascript">
        window.userSettings = /*[[${userSettings}]]*/ {};
    </script>
</head>
<body class="settings-page stats-page">
<div class="navigation-container" th:replace="~{fragments/main-navigation :: main-navigation('statistics')}"></div>
<main id="statistics-root"
      class="stats-root"
      th:hx-get="${compareKey != null and !compareKey.isEmpty()} ? @{/statistics/fragments/report(period=${periodKey},compare=${compareKey})} : @{/statistics/fragments/report(period=${periodKey})}"
      hx-trigger="load"
      hx-target="#statistics-root"
      hx-vals='js:{timezone: getUserTimezone()}'>
    <div class="stats-loading" th:text="#{timeline.loading}">Loading...</div>
</main>
</body>
</html>
