<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{settings.title}">Settings - Reitti</title>
    <link rel="icon" th:href="@{/img/logo-64x64.png}">
    <link rel="apple-touch-icon" th:href="@{/img/logo.svg}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/img/logo-64x64.png}">
    <link rel="stylesheet" th:href="@{/css/leaflet.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/lineicons.css}">
    <script th:src="@{/js/messages.js(v=${appVersion})}"></script>
    <script th:src="@{/js/vendor/htmx.min.js}"></script>
    <script th:src="@{/js/vendor/leaflet.js}"></script>
    <script th:src="@{/js/vendor/TileLayer.Grayscale.js}"></script>
    <script th:src="@{/js/util.js}"></script>
</head>
<body class="settings-page">
<div class="navigation-container" th:replace="~{fragments/main-navigation :: main-navigation('settings')}"></div>

<div class="settings-container">
    <div th:replace="~{fragments/settings-navigation :: settings-nav(${activeSection}, ${dataManagementEnabled}, ${isAdmin})}"></div>
    <div class="settings-content-area">
        <div id="user-management" class="settings-section active">
            <div th:replace="~{fragments/user-management :: ${isAdmin ? 'users-list' : 'user-form-page'}}"></div>
        </div>
    </div>
</div>

<div id="liveDataOnlyConfirmModal" class="reitti-dialog" role="dialog" aria-hidden="true">
    <div class="reitti-dialog-backdrop"></div>
    <div class="reitti-dialog-card">
        <div class="reitti-dialog-head">
            <h3 th:text="#{users.live-data-only.confirm.title}">Confirm Live Data Only Switch</h3>
            <button class="reitti-dialog-close" aria-label="Close">&times;</button>
        </div>
        <div class="reitti-dialog-body">
            <div id="liveDataOnlyError" class="alert alert-danger" style="display: none;"></div>
            <div class="alert alert-danger" style="display: block;">
                <span th:text="#{users.live-data-only.warning}">This will permanently delete all your location history, visits, trips, places, and memories. This action cannot be undone.</span>
            </div>
            <div class="form-group">
                <label id="liveDataOnlyConfirmLabel">To confirm, please type the username:</label>
                <input type="text" id="liveDataOnlyConfirmUsername" autocomplete="off" required>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn" id="liveDataOnlyCancelBtn" th:text="#{form.cancel}">Cancel</button>
                <button type="button" class="btn btn-danger" id="liveDataOnlySubmitBtn">
                    <span class="btn-text" th:text="#{users.live-data-only.confirm.submit}">Delete All Data &amp; Switch</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function() {
    var liveDataModal = document.getElementById('liveDataOnlyConfirmModal');
    var liveDataConfirmLabel = document.getElementById('liveDataOnlyConfirmLabel');
    var liveDataConfirmInput = document.getElementById('liveDataOnlyConfirmUsername');
    var liveDataErrorDiv = document.getElementById('liveDataOnlyError');
    var liveDataSubmitBtn = document.getElementById('liveDataOnlySubmitBtn');
    var liveDataCancelBtn = document.getElementById('liveDataOnlyCancelBtn');
    var pendingForm = null;

    function closeLiveDataModal() {
        if (!liveDataModal) return;
        liveDataModal.classList.remove('open');
        liveDataConfirmInput.value = '';
        liveDataErrorDiv.style.display = 'none';
        liveDataSubmitBtn.classList.remove('btn-loading');
        liveDataSubmitBtn.disabled = false;
        pendingForm = null;
    }

    document.body.addEventListener('htmx:beforeRequest', function(evt) {
        var form = evt.target;
        if (!form.classList || !form.classList.contains('user-form')) return;
        var userType = document.getElementById('userType');
        if (!userType || userType.value !== 'LIVE_DATA_ONLY') return;

        var userIdInput = form.querySelector('input[name="userId"]');
        if (!userIdInput || !userIdInput.value) return;

        var originalType = userType.getAttribute('data-original');
        if (originalType === 'LIVE_DATA_ONLY') return;

        if (form.querySelector('input[name="_confirmLiveDataOnly"]')) return;

        evt.preventDefault();
        pendingForm = form;
        var usernameInput = form.querySelector('input[name="username"]');
        var username = usernameInput ? usernameInput.value : '';
        liveDataConfirmLabel.textContent = t('users.live-data-only.confirm.description') + ' ' + username;
        liveDataConfirmInput.placeholder = username;
        liveDataErrorDiv.style.display = 'none';
        liveDataModal.classList.add('open');
        liveDataConfirmInput.focus();
    });

    liveDataCancelBtn.addEventListener('click', closeLiveDataModal);
    liveDataModal.querySelector('.reitti-dialog-backdrop').addEventListener('click', function(e) {
        if (e.target === this) closeLiveDataModal();
    });
    liveDataModal.querySelector('.reitti-dialog-close').addEventListener('click', closeLiveDataModal);

    liveDataSubmitBtn.addEventListener('click', function() {
        if (!pendingForm) return;
        var typed = liveDataConfirmInput.value.trim();
        if (!typed) {
            liveDataErrorDiv.textContent = t('users.live-data-only.confirm.error');
            liveDataErrorDiv.style.display = 'block';
            return;
        }

        var hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = '_confirmLiveDataOnly';
        hidden.value = typed;
        pendingForm.appendChild(hidden);

        liveDataModal.classList.remove('open');
        liveDataSubmitBtn.classList.add('btn-loading');
        liveDataSubmitBtn.disabled = true;
        pendingForm.querySelector('button[type="submit"]').click();
    });

    function cleanupConfirmField() {
        var fields = document.querySelectorAll('input[name="_confirmLiveDataOnly"]');
        fields.forEach(function(f) { f.remove(); });
        liveDataSubmitBtn.classList.remove('btn-loading');
        liveDataSubmitBtn.disabled = false;
    }

    document.addEventListener('htmx:afterRequest', function() {
        cleanupConfirmField();
    });

    document.addEventListener('htmx:sendError', function() {
        cleanupConfirmField();
        if (liveDataModal.classList.contains('open')) {
            closeLiveDataModal();
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && liveDataModal && liveDataModal.classList.contains('open')) {
            closeLiveDataModal();
        }
    });

    liveDataConfirmInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && liveDataModal && liveDataModal.classList.contains('open')) {
            liveDataSubmitBtn.click();
        }
    });
});
</script>

<script th:inline="javascript">
    window.userSettings = /*[[${userSettings}]]*/ {}

    // Avatar selection JavaScript
    document.addEventListener('DOMContentLoaded', function() {
        // Clear file input when default avatar is selected
        document.addEventListener('change', function(e) {
            if (e.target.name === 'defaultAvatar') {
                const fileInput = document.getElementById('avatar');
                if (fileInput) {
                    fileInput.value = '';
                }
            }
        });

        // Clear default avatar selection when file is selected
        const avatarFileInput = document.getElementById('avatar');
        if (avatarFileInput) {
            avatarFileInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    document.querySelectorAll('input[name="defaultAvatar"]').forEach(radio => {
                        radio.checked = false;
                    });
                }
            });
        }
    });

    function removeCurrentAvatar() {
        // Hide the current avatar preview
        const avatarPreview = document.querySelector('.current-avatar');
        if (avatarPreview) {
            avatarPreview.style.display = 'none';
        }

        // Clear the file input
        const fileInput = document.getElementById('avatar');
        if (fileInput) {
            fileInput.value = '';
        }

        // Set the remove flag
        const removeFlag = document.getElementById('removeAvatarFlag');
        if (removeFlag) {
            removeFlag.value = 'true';
        }

        // Hide the remove button
        const avatarActions = document.querySelector('.avatar-actions');
        if (avatarActions) {
            avatarActions.style.display = 'none';
        }
    }
    // Home location map functionality
    let homeLocationMap;
    let homeLocationMarker;

    function initializeHomeLocationMap() {
        if (typeof L === 'undefined') {
            console.error('Leaflet is not loaded');
            return;
        }
        const tilesUrl = window.userSettings.tiles.service;
        const tilesAttribution = window.userSettings.tiles.attribution;
        const tileLayer = L.tileLayer.grayscale;

        // Initialize map
        homeLocationMap = L.map('homeLocationMap').setView([60.1699, 24.9384], 10)
        // Add tile layer
        tileLayer(tilesUrl, {
            attribution: tilesAttribution
        }).addTo(homeLocationMap);

        // Get current home location from form inputs
        const latInput = document.getElementById('homeLatitude');
        const lngInput = document.getElementById('homeLongitude');

        if (latInput && latInput.value && lngInput && lngInput.value) {
            const lat = parseFloat(latInput.value);
            const lng = parseFloat(lngInput.value);

            if (!isNaN(lat) && !isNaN(lng)) {
                homeLocationMap.setView([lat, lng], 13);
                // Create marker
                homeLocationMarker = L.circleMarker([lat, lng], {
                    radius: 15,
                    fillColor: '#ff6c00',
                    color: '#fff',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8,
                    draggable: true
                }).addTo(homeLocationMap);

                homeLocationMarker.on('dragend', function(e) {
                    const position = e.target.getLatLng();
                    updateCoordinateInputs(position.lat, position.lng);
                });
            }
        }

        // Add click event to map
        homeLocationMap.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (homeLocationMarker) {
                homeLocationMap.removeLayer(homeLocationMarker);
            }

            homeLocationMarker = L.circleMarker([lat, lng], {
                radius: 15,
                fillColor: '#ff6c00',
                color: '#fff',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8,
                draggable: true
            }).addTo(homeLocationMap);
            updateCoordinateInputs(lat, lng);

            homeLocationMarker.on('dragend', function(e) {
                const position = e.target.getLatLng();
                updateCoordinateInputs(position.lat, position.lng);
            });
        });
    }

    function updateCoordinateInputs(lat, lng) {
        const latInput = document.getElementById('homeLatitude');
        const lngInput = document.getElementById('homeLongitude');
        if (latInput && lngInput) {
            latInput.value = lat.toFixed(6);
            lngInput.value = lng.toFixed(6);
        }
    }

    window.updateMapMarker = function() {
        if (!homeLocationMap) return;

        const latInput = document.getElementById('homeLatitude');
        const lngInput = document.getElementById('homeLongitude');

        if (!latInput || !lngInput) return;

        const lat = parseFloat(latInput.value);
        const lng = parseFloat(lngInput.value);

        if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
            if (homeLocationMarker) {
                homeLocationMap.removeLayer(homeLocationMarker);
            }

            homeLocationMarker = L.circleMarker([lat, lng], {
                radius: 15,
                fillColor: '#ff6c00',
                color: '#fff',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8,
                draggable: true
            }).addTo(homeLocationMap);
            homeLocationMap.setView([lat, lng], 13);

            homeLocationMarker.on('dragend', function(e) {
                const position = e.target.getLatLng();
                updateCoordinateInputs(position.lat, position.lng);
            });
        } else if (homeLocationMarker) {
            homeLocationMap.removeLayer(homeLocationMarker);
            homeLocationMarker = null;
        }
    }

    window.clearHomeLocation = function() {
        const latInput = document.getElementById('homeLatitude');
        const lngInput = document.getElementById('homeLongitude');

        if (latInput) latInput.value = '';
        if (lngInput) lngInput.value = '';

        if (homeLocationMarker && homeLocationMap) {
            homeLocationMap.removeLayer(homeLocationMarker);
            homeLocationMarker = null;
        }
    }

    // Initialize home location map when user management section loads
    document.body.addEventListener('htmx:afterSettle', function(evt) {
        if (evt.detail.target.querySelector && evt.detail.target.querySelector('#homeLocationMap')) {
            setTimeout(initializeHomeLocationMap, 100);
        }
    });
</script>

<script th:inline="javascript">
    window.userSettings = /*[[${userSettings}]]*/ {}
</script>
</body>
