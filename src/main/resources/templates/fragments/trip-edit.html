<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="transport-mode-dialog" class="transport-mode-dialog">
    <h2 th:text="#{timeline.trip.transport.edit.headline}">Edit Transport Modes</h2>
    <form th:action="@{/timeline/trips/{id}/transport-modes(id=${tripId})}" method="POST">
        <input type="hidden" name="returnUrl" th:value="${returnUrl}">
        <th:block th:each="segment, iterStat : ${transportModeSegments}">
            <input type="hidden" th:name="${'segments[' + iterStat.index + '].offsetSeconds'}" th:value="${segment.offsetSeconds()}">
            <div class="form-group">
                <label>
                    <span th:text="${#temporals.format(tripStartTime.plusSeconds(segment.offsetSeconds()), 'HH:mm')}">14:00</span>
                    <span th:text="'- ' + ${#temporals.format(tripStartTime.plusSeconds(segment.offsetSeconds() + segment.durationSeconds()), 'HH:mm')}">14:05</span>
                </label>
                <select th:name="${'segments[' + iterStat.index + '].transportMode'}" required>
                    <option th:each="mode : ${availableTransportModes}"
                            th:value="${mode}"
                            th:text="#{${'transportation.mode.' + mode + '.name'}}"
                            th:selected="${mode == segment.mode()}"></option>
                </select>
            </div>
        </th:block>
        <div class="form-buttons">
            <button type="submit" class="btn btn-primary" th:text="#{form.save.changes}">Save Changes</button>
            <button type="button" class="btn btn-secondary" onclick="closeTransportModeOverlay()" th:text="#{form.cancel}">Cancel</button>
        </div>
    </form>
</div>

<div th:fragment="view-mode" class="trip-transport-mode-container" th:id="${'trip-transport-mode-container_' + tripId}">
    <span class="segment-list">
        <span class="segment-chip" th:each="mode : ${transportModesSet}">
            <span th:text="#{'timeline.transport.' + ${mode} + '.label'}">by foot</span>
        </span>
    </span>
</div>

</body>
</html>
