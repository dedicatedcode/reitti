<div xmlns:th="http://www.thymeleaf.org" th:fragment="configuration-preview" class="settings-card" id="configuration-preview">
    <h3 th:text="#{visit.sensitivity.preview.title}">Configuration Preview</h3>
    
    <div class="preview-controls">
        <div class="toggle-buttons">
            <button id="current-data-btn" class="btn btn-primary active" onclick="showCurrentData()">
                <span th:text="#{visit.sensitivity.preview.current}">Current Data</span>
            </button>
            <button id="preview-data-btn" class="btn btn-secondary" onclick="showPreviewData()">
                <span th:text="#{visit.sensitivity.preview.new}">Preview Data</span>
                <span id="preview-status" class="status-indicator">
                   <i class="lni lni-is-spinning lni-spinner-2-sacle"></i>
                    <span th:text="#{visit.sensitivity.preview.calculating}">Calculating...</span>
                </span>
            </button>
        </div>
        <div class="date-selection">
            <label for="preview-date" th:text="#{visit.sensitivity.preview.date}">Preview Date:</label>
            <input type="date" 
                   id="preview-date" 
                   th:value="${previewDate}" 
                   th:hx-post="@{/settings/visit-sensitivity/preview}"
                   hx-vals='js:{"timezone": getUserTimezone()}'
                   hx-target="#preview-area"
                   hx-include="#configuration-form"
                   hx-trigger="change[target.value != ''] delay:1s"
                   name="previewDate">
        </div>
    </div>
    
    <div class="preview-maps">
        <!-- Current Data Map -->
        <div id="current-map-container" class="map-container active">
            <div class="map-with-timeline">
                <div id="current-timeline" class="timeline-sidebar">
                    <div id="current-timeline-content" class="timeline-content">
                        <div class="loading">Loading timeline...</div>
                    </div>
                </div>
                <div id="current-map" class="map"></div>
            </div>
        </div>
        
        <!-- Preview Data Map -->
        <div id="preview-map-container" class="map-container">
            <div class="map-with-timeline">
                <div id="preview-timeline" class="timeline-sidebar">
                    <div id="preview-timeline-content" class="timeline-content">
                        <div class="loading">Loading preview...</div>
                    </div>
                </div>
                <div id="preview-map" class="map"></div>
            </div>
        </div>
    </div>
    
    <div class="preview-info">
        <h4 th:text="#{visit.sensitivity.preview.config.details}">Configuration Details</h4>
        <div class="config-details">
            <div class="detail-group">
                <h4 th:text="#{visit.sensitivity.visit.detection}">Visit Detection</h4>
                <p><strong th:text="#{visit.sensitivity.min.stay.time}">Minimum Stay Time:</strong>
                   <span th:text="${previewConfig.visitDetection.minimumStayTimeInSeconds}"></span>s</p>
                <p><strong th:text="#{visit.sensitivity.max.merge.time}">Max Merge Time:</strong>
                   <span th:text="${previewConfig.visitDetection.maxMergeTimeBetweenSameStayPoints}"></span>s</p>
            </div>
            <div class="detail-group">
                <h4 th:text="#{visit.sensitivity.visit.merging}">Visit Merging</h4>
                <p><strong th:text="#{visit.sensitivity.search.duration}">Search Duration:</strong> 
                   <span th:text="${previewConfig.visitMerging.searchDurationInHours}"></span>h</p>
                <p><strong th:text="#{visit.sensitivity.max.merge.time}">Max Merge Time:</strong> 
                   <span th:text="${previewConfig.visitMerging.maxMergeTimeBetweenSameVisits}"></span>s</p>
                <p><strong th:text="#{visit.sensitivity.min.distance}">Min Distance:</strong> 
                   <span th:text="${previewConfig.visitMerging.placeRadiusMeters}"></span>m</p>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        (function() {
            let previewId = /*[[${previewId}]]*/ '';
            let previewDate = /*[[${previewDate}]]*/ '';
            let userId = /*[[${userId}]]*/ null;
            let currentEntry = null;
            let previewEntry = null;
            let currentMapInitialized = false;
            let previewMapInitialized = false;
            let previewReady = false;
            let eventSource = null;
            let reconnectTimeoutId = null;
            let statusPollTimeoutId = null;
            let statusPollCount = 0;
            const MAX_STATUS_POLLS = 60;

            // Maps from a previous fragment instance must be destroyed before
            // new ones are created, otherwise WebGL contexts pile up.
            if (typeof window.__destroyPreviewMaps === 'function') {
                window.__destroyPreviewMaps();
            }
            window.__previewMapEntries = [];
            window.__destroyPreviewMaps = function() {
                (window.__previewMapEntries || []).forEach(entry => destroyPreviewMapEntry(entry));
                window.__previewMapEntries = [];
            };
            if (!window.__previewBeforeSwapHooked) {
                window.__previewBeforeSwapHooked = true;
                document.body.addEventListener('htmx:beforeSwap', function(event) {
                    const target = event.detail?.target;
                    if (!target) return;
                    if (target.id === 'preview-area' || target.tagName === 'BODY'
                        || (target.closest && target.closest('#preview-area'))) {
                        window.__destroyPreviewMaps?.();
                    }
                });
            }

            window.showCurrentData = function() {
                document.getElementById('current-data-btn').classList.add('active');
                document.getElementById('preview-data-btn').classList.remove('active');
                document.getElementById('current-map-container').classList.add('active');
                document.getElementById('preview-map-container').classList.remove('active');

                if (!currentMapInitialized) {
                    initCurrentMap();
                } else if (currentEntry) {
                    refitEntry(currentEntry);
                }
            };

            window.showPreviewData = function() {
                document.getElementById('current-data-btn').classList.remove('active');
                document.getElementById('preview-data-btn').classList.add('active');
                document.getElementById('current-map-container').classList.remove('active');
                document.getElementById('preview-map-container').classList.add('active');

                if (!previewMapInitialized && previewReady) {
                    initPreviewMap();
                } else if (previewMapInitialized && previewReady) {
                    // Reload data in case it was updated while tab was inactive
                    if (previewEntry) {
                        refitEntry(previewEntry);
                    }
                    loadPreviewMapData();
                }
            };
            
            function resolvePreviewStyle() {
                const styles = Array.isArray(window.reittiCustomMapStyles) ? window.reittiCustomMapStyles : [];
                const activeId = window.reittiActiveMapStyleId || window.localStorage?.getItem('mapStyleId');
                const style = styles.find(candidate => candidate.id === activeId) || styles[0];
                if (style) {
                    if (style.mapType === 'raster' && style.styleInputType === 'url') {
                        return style.styleUrl;
                    }
                    if (style.mapType === 'vector') {
                        if (style.styleInputType === 'url') {
                            return style.styleUrl;
                        }
                        if (style.styleInputType === 'json') {
                            try {
                                const definition = typeof style.styleInput === 'string' ? JSON.parse(style.styleInput) : style.styleInput;
                                // The preview is a small 2D map: strip terrain and
                                // 3D content so the first render stays fast.
                                if (definition && typeof definition === 'object') {
                                    delete definition.terrain;
                                    if (Array.isArray(definition.layers)) {
                                        definition.layers = definition.layers.filter(layer =>
                                            layer.type !== 'hillshade' && layer.type !== 'fill-extrusion');
                                    }
                                }
                                return definition;
                            } catch (error) {
                                console.warn('Unable to parse map style', error);
                            }
                        }
                    }
                }
                // Fallback: build a raster style from the configured tile service
                const tiles = window.userSettings?.tiles;
                if (tiles?.service) {
                    return {
                        version: 8,
                        sources: {
                            preview: {
                                type: 'raster',
                                tiles: [tiles.service],
                                tileSize: 256,
                                attribution: tiles.attribution || ''
                            }
                        },
                        layers: [
                            {id: 'background', type: 'background', paint: {'background-color': '#1a1a1a'}},
                            {id: 'tiles', type: 'raster', source: 'preview'}
                        ]
                    };
                }
                return null;
            }

            function configureMapWorker() {
                if (!window.maplibregl?.setWorkerUrl) return;
                const contextPath = (window.contextPath || '').replace(/\/$/, '');
                window.maplibregl.setWorkerUrl(`${window.location.origin}${contextPath}/js/vendor/maplibre-gl-worker.6.16.0.mjs`);
            }

            function destroyPreviewMapEntry(entry) {
                if (!entry) return;
                try {
                    entry.map.remove();
                } catch (error) {
                    console.warn('Could not dispose preview map', error);
                }
            }

            function emptyFeatureCollection() {
                return {type: 'FeatureCollection', features: []};
            }

            function createPreviewMap(containerId, color) {
                const style = resolvePreviewStyle();
                if (!style || !window.maplibregl) {
                    console.warn('No map style available for the preview map');
                    return null;
                }
                configureMapWorker();
                const map = new maplibregl.Map({
                    container: containerId,
                    style: style,
                    center: [window.userSettings?.homeLongitude || 24.9384, window.userSettings?.homeLatitude || 60.1699],
                    zoom: 12,
                    attributionControl: false,
                    dragRotate: false,
                    pitchWithRotate: false
                });
                const entry = {map, color, ready: false, needsRender: false, needsFit: false, timelineData: null, points: null};
                window.__previewMapEntries.push(entry);
                map.on('load', () => {
                    strip3DContent(map);
                    setupPreviewLayers(map, entry.color);
                    // map.css fades the canvas/controls in only once the
                    // container carries the is-loaded class.
                    map.getContainer().classList.add('is-loaded');
                    entry.ready = true;
                    if (entry.needsRender) {
                        renderEntryData(entry);
                    }
                });
                map.on('error', event => console.warn('Preview map error', event?.error?.message || event));
                return entry;
            }

            function strip3DContent(map) {
                // The preview is a small 2D view. Extruded buildings are
                // depth-tested and would hide the ground-level path and visit
                // layers, so switch all 3D content off regardless of whether
                // the style was configured as URL or JSON.
                map.getStyle()?.layers?.forEach(layer => {
                    if (layer.type === 'fill-extrusion' || layer.type === 'hillshade') {
                        map.setLayoutProperty(layer.id, 'visibility', 'none');
                    }
                });
                if (map.getTerrain()) {
                    map.setTerrain(null);
                }
            }

            function setupPreviewLayers(map, color) {
                map.addSource('preview-path', {type: 'geojson', data: emptyFeatureCollection()});
                map.addSource('preview-visit-areas', {type: 'geojson', data: emptyFeatureCollection()});
                map.addSource('preview-visit-dots', {type: 'geojson', data: emptyFeatureCollection()});

                map.addLayer({
                    id: 'preview-path-line',
                    type: 'line',
                    source: 'preview-path',
                    layout: {'line-join': 'round', 'line-cap': 'round'},
                    paint: {'line-color': color, 'line-width': 2, 'line-opacity': 0.9}
                });
                map.addLayer({
                    id: 'preview-visit-area-fill',
                    type: 'fill',
                    source: 'preview-visit-areas',
                    paint: {'fill-color': color, 'fill-opacity': 0.1}
                });
                map.addLayer({
                    id: 'preview-visit-area-outline',
                    type: 'line',
                    source: 'preview-visit-areas',
                    paint: {'line-color': color, 'line-width': 1, 'line-opacity': 0.9}
                });
                map.addLayer({
                    id: 'preview-visit-dot',
                    type: 'circle',
                    source: 'preview-visit-dots',
                    paint: {
                        'circle-radius': 5,
                        'circle-color': color,
                        'circle-opacity': 0.8,
                        'circle-stroke-width': 1,
                        'circle-stroke-color': '#ffffff'
                    }
                });

                const showVisitPopup = (event) => showVisitTooltip(map, event);
                const hideVisitPopup = () => {
                    if (window.__previewPopup) {
                        window.__previewPopup.remove();
                        window.__previewPopup = null;
                    }
                };
                ['preview-visit-areas', 'preview-visit-dots'].forEach(layerId => {
                    map.on('mousemove', layerId, showVisitPopup);
                    map.on('mouseleave', layerId, hideVisitPopup);
                });
            }

            function showVisitTooltip(map, event) {
                const properties = event.features?.[0]?.properties;
                if (!properties) return;
                if (window.__previewPopup) {
                    window.__previewPopup.remove();
                }
                const visitCount = properties.count;
                const visitText = visitCount === 1 ? 'visit' : 'visits';
                const totalDurationText = humanizeDuration(properties.durationMs, {units: ["h", "m"], round: true});
                window.__previewPopup = new maplibregl.Popup({closeButton: false, closeOnClick: false, offset: 8})
                    .setLngLat(event.lngLat)
                    .setHTML(`<div class="preview-popup">
                                 <div class="preview-popup-title">${properties.name || 'Unknown Place'}</div>
                                 <div class="preview-popup-body">${visitCount} ${visitText} - Total: ${totalDurationText}</div>
                              </div>`)
                    .addTo(map);
            }

            function initCurrentMap() {
                if (currentMapInitialized) return;
                currentEntry = createPreviewMap('current-map', '#ff6c00');
                currentMapInitialized = true;
                loadCurrentMapData();
            }

            function initPreviewMap() {
                if (previewMapInitialized) return;
                previewEntry = createPreviewMap('preview-map', '#4CAF50');
                previewMapInitialized = true;
                loadPreviewMapData();
            }
            
            function loadCurrentMapData() {
                if (!currentEntry) return;

                // Fetch current processed visits/trips for the selected date
                fetch(window.contextPath + `/api/v1/timeline?date=${previewDate}&timezone=${encodeURIComponent(getUserTimezone())}`)
                    .then(response => response.json())
                    .then(data => {
                        updateTimelineContent('current-timeline-content', data);
                        currentEntry.timelineData = data;
                        renderEntryData(currentEntry);
                    })
                    .catch(error => {
                        console.error('Error loading current map data:', error);
                        document.getElementById('current-timeline-content').innerHTML = '<div class="error">Error loading timeline</div>';
                    });
                loadLocationPath(currentEntry);
            }

            function loadPreviewMapData() {
                if (!previewEntry || !previewReady) return;

                // Fetch preview processed visits/trips
                fetch(window.contextPath + `/api/v1/preview/${previewId}/timeline?date=${previewDate}&timezone=${encodeURIComponent(getUserTimezone())}`)
                    .then(response => response.json())
                    .then(data => {
                        updateTimelineContent('preview-timeline-content', data);
                        previewEntry.timelineData = data;
                        renderEntryData(previewEntry);
                    })
                    .catch(error => {
                        console.error('Error loading preview map data:', error);
                        document.getElementById('preview-timeline-content').innerHTML = '<div class="error">Error loading preview</div>';
                    });
                loadLocationPath(previewEntry);
            }

            function loadLocationPath(entry) {
                if (!entry) return;
                const streamUrl = `/api/v3/locations/stream/${userId}?start=${encodeURIComponent(previewDate)}&end=${encodeURIComponent(previewDate)}&timezone=${encodeURIComponent(getUserTimezone())}`;
                LocationStream.fetchPoints(window.contextPath + streamUrl)
                    .then(points => {
                        entry.points = points;
                        renderEntryData(entry);
                    })
                    .catch(error => {
                        console.warn('Error fetching location path:', error);
                    });
            }

            function renderEntryData(entry) {
                if (!entry.ready) {
                    entry.needsRender = true;
                    return;
                }
                const bounds = new maplibregl.LngLatBounds();
                extendBounds(bounds, renderVisits(entry));
                extendBounds(bounds, renderPath(entry));
                if (bounds.isEmpty()) {
                    return;
                }
                // Fitting a hidden container produces a broken viewport; defer
                // until the tab becomes visible again.
                const container = entry.map.getContainer();
                if (container.clientWidth === 0 || container.clientHeight === 0) {
                    entry.needsFit = true;
                    return;
                }
                entry.needsFit = false;
                entry.map.fitBounds(bounds, {padding: 20, maxZoom: 15, duration: 0});
            }

            function refitEntry(entry) {
                entry.map.resize();
                if (entry.needsFit) {
                    renderEntryData(entry);
                }
            }

            function extendBounds(target, source) {
                if (!source || source.isEmpty()) return;
                target.extend([source.getWest(), source.getSouth()]);
                target.extend([source.getEast(), source.getNorth()]);
            }

            function renderVisits(entry) {
                const data = entry.timelineData;
                const areaFeatures = [];
                const dotFeatures = [];
                const bounds = new maplibregl.LngLatBounds();

                // Group places by coordinates to avoid duplicate markers
                const placeGroups = new Map();

                if (data && data.length > 0) {
                    data.forEach(element => {
                        if (element.type === 'VISIT') {
                            const lat = element.place?.latitudeCentroid;
                            const lng = element.place?.longitudeCentroid;

                            if (lat && lng) {
                                const coordKey = `${lat.toFixed(6)},${lng.toFixed(6)}`;

                                if (!placeGroups.has(coordKey)) {
                                    placeGroups.set(coordKey, {
                                        lat: lat,
                                        lng: lng,
                                        totalDurationMs: 0,
                                        visits: [],
                                        place: element.place
                                    });
                                }
                                const group = placeGroups.get(coordKey);
                                group.totalDurationMs += parseDurationText(element.formattedDuration);
                                group.visits.push(element);

                                bounds.extend([lng, lat]);
                            }
                        }
                    });
                }

                placeGroups.forEach((group) => {
                    const {lat, lng, totalDurationMs, visits, place} = group;

                    // Calculate radius using logarithmic scale (meters)
                    const durationHours = totalDurationMs / (1000 * 60 * 60);
                    const baseRadius = 15;
                    const maxRadius = 100;
                    const minRadius = 15;

                    const logScale = Math.log(1 + durationHours) / Math.log(1 + 24);
                    const radius = Math.min(maxRadius, Math.max(minRadius, baseRadius + (logScale * (maxRadius - baseRadius))));

                    const properties = {
                        name: place?.name || 'Unknown Place',
                        count: visits.length,
                        durationMs: totalDurationMs
                    };

                    areaFeatures.push({
                        type: 'Feature',
                        properties: properties,
                        geometry: {type: 'Polygon', coordinates: [circleRing(lng, lat, radius)]}
                    });
                    dotFeatures.push({
                        type: 'Feature',
                        properties: properties,
                        geometry: {type: 'Point', coordinates: [lng, lat]}
                    });
                });

                entry.map.getSource('preview-visit-areas')?.setData({type: 'FeatureCollection', features: areaFeatures});
                entry.map.getSource('preview-visit-dots')?.setData({type: 'FeatureCollection', features: dotFeatures});
                return bounds;
            }

            function renderPath(entry) {
                const points = entry.points || [];
                const bounds = new maplibregl.LngLatBounds();
                const features = [];
                let segment = [];

                const flushSegment = () => {
                    if (segment.length >= 2) {
                        features.push({
                            type: 'Feature',
                            properties: {},
                            geometry: {type: 'LineString', coordinates: segment}
                        });
                        segment.forEach(coordinate => bounds.extend(coordinate));
                    }
                    segment = [];
                };

                for (let i = 0; i < points.length; i++) {
                    const point = points[i];
                    if (i > 0 && point.timestamp - points[i - 1].timestamp > 300) {
                        flushSegment();
                    }
                    segment.push([point.lng, point.lat]);
                }
                flushSegment();

                entry.map.getSource('preview-path')?.setData({type: 'FeatureCollection', features: features});
                return bounds;
            }

            function circleRing(lng, lat, radiusMeters, steps = 40) {
                const ring = [];
                const latRad = lat * Math.PI / 180;
                const latDistance = radiusMeters / 111320;
                const lngDistance = radiusMeters / (111320 * Math.max(Math.cos(latRad), 0.01));
                for (let i = 0; i <= steps; i++) {
                    const theta = (i / steps) * 2 * Math.PI;
                    ring.push([lng + lngDistance * Math.cos(theta), lat + latDistance * Math.sin(theta)]);
                }
                return ring;
            }
            
            function updateTimelineContent(containerId, data) {
                const container = document.getElementById(containerId);
                if (!container) return;
                
                let html = '';

                if (data.length > 0) {
                    data.forEach(element => {
                        if (element.type === 'TRIP') {
                            const trip = element;
                            const timeRange = trip.formattedTimeRange;
                            const duration = trip.formattedDuration;
                            const distance = trip.formattedDistance;
                            const mode = trip.transportMode || 'Unknown';

                            html += `
                                <div class="timeline-entry trip">
                                    <div class="place-name">Trip</div>
                                    <div class="entry-time">${timeRange}</div>
                                    <div class="trip-info">
                                        <span class="transport-mode">${mode}</span>
                                        ${distance ? `<span class="distance">${distance}</span>` : ''}
                                    </div>
                                    <div class="entry-duration">${duration}</div>
                                </div>
                            `;
                        } else if (element.type === 'VISIT') {
                            const visit = element;
                            const timeRange = visit.formattedTimeRange;
                            const duration = visit.formattedDuration;
                            const placeName = visit.place?.name || 'Unknown Place';

                            html += `
                            <div class="timeline-entry visit" data-lat="${visit.place?.latitudeCentroid}" data-lng="${visit.place?.longitudeCentroid}">
                                <div class="place-name">${placeName}</div>
                                <div class="entry-time">${timeRange}</div>
                                <div class="entry-duration">${duration}</div>
                            </div>
                        `;
                        }
                    });
                }
                
                if (html === '') {
                    html = '<div class="no-data">No timeline data for this date</div>';
                }
                
                container.innerHTML = html;
            }
            
            function getUserTimezone() {
                if (window.userSettings?.timezoneOverride) {
                    return window.userSettings.timezoneOverride;
                } else {
                    return Intl.DateTimeFormat().resolvedOptions().timeZone;
                }
            }
            const locale =  {
                preview: {
                    ready: t('visit.sensitivity.preview.ready'),
                    error: t('visit.sensitivity.preview.error'),
                }
            }
            function checkPreviewStatus() {
                statusPollTimeoutId = null;
                fetch(window.contextPath + `/api/v1/preview/${previewId}/status`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.ready) {
                            previewReady = true;
                            const statusElement = document.getElementById('preview-status');
                            if (statusElement) {
                                statusElement.innerHTML = data.failed
                                    ? `<i class="lni lni-warning"></i><span>${locale.preview.error}</span>`
                                    : `<i class="lni lni-checkmark-circle"></i><span>${locale.preview.ready}</span>`;
                            }
                            const previewBtn = document.getElementById('preview-data-btn');
                            if (previewBtn) {
                                previewBtn.disabled = false;
                            }
                            
                            // If preview tab is active, initialize the map
                            if (previewBtn && previewBtn.classList.contains('active')) {
                                initPreviewMap();
                            } else if (previewMapInitialized) {
                                // If map is already initialized, just load the data
                                loadPreviewMapData();
                            }
                        } else if (++statusPollCount > MAX_STATUS_POLLS) {
                            const statusElement = document.getElementById('preview-status');
                            if (statusElement) {
                                statusElement.innerHTML = 
                                    `<i class="lni lni-warning"></i><span>${locale.preview.error}</span>`;
                            }
                        } else {
                            // Continue polling
                            statusPollTimeoutId = setTimeout(checkPreviewStatus, 2000);
                        }
                    })
                    .catch(error => {
                        console.error('Error checking preview status:', error);
                        const statusElement = document.getElementById('preview-status');
                        if (statusElement) {
                            statusElement.innerHTML = 
                                `<i class="lni lni-warning"></i><span>${locale.preview.error}</span>`;
                        }
                    });
            }

            // Helper function to parse duration text (simple implementation)
            function parseDurationText(durationText) {
                // Extract numbers followed by 'h' or 'm'
                const hours = (durationText.match(/(\d+)h/) || [0, 0])[1];
                const minutes = (durationText.match(/(\d+)m/) || [0, 0])[1];
                return (parseInt(hours) * 60 + parseInt(minutes)) * 60 * 1000; // Convert to milliseconds
            }
            
            function connectSSE() {
                console.log('Configuration Preview: Connecting to SSE...');
                eventSource = new EventSource(window.contextPath + '/events');

                eventSource.onopen = function() {
                    console.log('Configuration Preview: SSE connection opened.');
                    
                    // Clear any pending reconnect timeout since we're connected
                    if (reconnectTimeoutId) {
                        clearTimeout(reconnectTimeoutId);
                        reconnectTimeoutId = null;
                    }
                };

                eventSource.onerror = function(error) {
                    console.error('Configuration Preview: EventSource failed:', error);
                    
                    // Close the current connection
                    if (eventSource) {
                        eventSource.close();
                        eventSource = null;
                    }
                    
                    // Schedule reconnection after 5 seconds
                    if (!reconnectTimeoutId) {
                        console.log('Configuration Preview: Scheduling SSE reconnection in 5 seconds...');
                        reconnectTimeoutId = setTimeout(() => {
                            reconnectTimeoutId = null;
                            connectSSE();
                        }, 5000);
                    }
                };

                eventSource.onmessage = function(event) {
                    console.log('Configuration Preview: Received SSE event:', event.data);
                    
                    // Clear any pending reconnect timeout since we're receiving messages
                    if (reconnectTimeoutId) {
                        clearTimeout(reconnectTimeoutId);
                        reconnectTimeoutId = null;
                    }
                    
                    // Parse the event data
                    try {
                        const eventData = JSON.parse(event.data);
                        
                        // Check if this event is for our preview
                        if (eventData.previewId && eventData.previewId === previewId) {
                            if (eventData.type === 'PREVIEW_DONE') {
                                // The run finished (successfully or not): re-read the status
                                // so the chip shows ready or error and polling stops.
                                console.log('Configuration Preview: Preview processing finished');
                                previewReady = true;
                                checkPreviewStatus();
                            } else if (eventData.type === 'PLACE' || (eventData.date && eventData.date === previewDate)) {
                                console.log('Configuration Preview: Received event for our preview, reloading data');
                                // Reload preview data if preview is ready and visible
                                if (previewReady) {
                                    if (document.getElementById('preview-data-btn').classList.contains('active')) {
                                        // Preview tab is active, reload immediately
                                        loadPreviewMapData();
                                    } else {
                                        // Preview tab is not active, just mark that data needs refresh
                                        console.log('Configuration Preview: Preview data updated, will refresh when tab becomes active');
                                    }
                                }
                                
                                // Also reload current data to show the difference
                                if (currentMapInitialized) {
                                    loadCurrentMapData();
                                }
                            }
                        }
                    } catch (error) {
                        console.warn('Configuration Preview: Could not parse SSE event data:', error);
                    }
                };
            }
            
            function disconnectSSE() {
                if (eventSource) {
                    console.log('Configuration Preview: Disconnecting SSE...');
                    eventSource.close();
                    eventSource = null;
                }
                
                if (reconnectTimeoutId) {
                    clearTimeout(reconnectTimeoutId);
                    reconnectTimeoutId = null;
                }

                if (statusPollTimeoutId) {
                    clearTimeout(statusPollTimeoutId);
                    statusPollTimeoutId = null;
                }
            }

            // Initialize current map by default
            initCurrentMap();
            
            
            // Start polling for preview status
            checkPreviewStatus();
            
            // Connect to SSE for real-time updates
            connectSSE();
            
            // Cleanup function for when the fragment is removed/replaced
            window.addEventListener('beforeunload', function() {
                disconnectSSE();
            });
            
            // Listen for htmx beforeSwap event to cleanup before DOM replacement
            document.addEventListener('htmx:beforeSwap', function(event) {
                // Check if the target contains our preview area
                if (event.detail.target && (
                    event.detail.target.id === 'preview-area' || 
                    event.detail.target.closest('#preview-area')
                )) {
                    console.log('Configuration Preview: Cleaning up SSE before DOM swap');
                    disconnectSSE();
                }
            });
            
            // Also disconnect when the page is hidden (e.g., tab switch)
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    disconnectSSE();
                } else {
                    // Reconnect when page becomes visible again
                    connectSSE();
                }
            });
        })();
    </script>
