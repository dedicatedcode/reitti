# reitti-device-sync configuration
#
# Copy to ~/.config/reitti-device-sync/config.conf and adjust.
# One [section] per physical device. The section name is used as the device
# identifier for `reitti-device-sync --device <name>` and for the per-device
# upload ledger in ~/.local/state/reitti-device-sync/<name>.tsv.
#
# Keys:
#   url                      Full upload endpoint of your reitti instance:
#                            FIT devices:  <base-url>/api/v2/fit/import
#                            GPX devices:  <base-url>/api/v1/gpx/import
#   token                    API token from reitti (Settings -> API Tokens).
#                            Create one token per device and attach it to the
#                            matching device.
#   device_id                Optional numeric reitti device id. Only needed
#                            when the token is NOT already bound to a device.
#   source                   A glob pattern to scan recursively for files.
#                            Repeat the 'source' key to add more patterns
#                            (one pattern per line). Paths with spaces are
#                            supported. NOTE: '*' does not match '/', so
#                            each nesting level needs its own line when it
#                            differs.
#                            IMPORTANT: copy paths WITHOUT the backslashes
#                            your shell shows when tab-completing (e.g.
#                            mtp\:host\=...) — those are display escapes
#                            only; the real directory is mtp:host=...
#   include_glob             Filename pattern (find -iname) of files to
#                            upload. Case-insensitive.
#   skip_modified_recent_min Skip files modified within the last N minutes;
#                            they may still be written by the device. (0 = off)
#   max_age_days             Only upload files newer than N days (0 = all).
#   settle_seconds           Seconds to wait before re-scanning when a source
#                            matched but no files were found yet (MTP devices
#                            need some time after mounting). Default: 5.
#                            Set to 0 to disable re-scanning.
#
# Tip: run `reitti-device-sync --dry-run --verbose` after editing to verify
# that each source glob matches the files you expect.

[garmin-edge]
# Edge 830/840 and similar Garmins are MTP devices; a desktop Linux with gvfs
# mounts them under /run/user/<your-uid>/gvfs/. Replace 1000 with your uid
# (`id -u`). NOTE: '*' in a glob does not match '/', so one 'source' line per
# nesting depth is needed. Both common layouts are covered below:
#   .../mtp:host=<device>/Garmin/Activities            (flat)
#   .../mtp:host=<device>/Internal Storage/Garmin/Activities   (Edge 830/840)
url = http://localhost:8080/api/v2/fit/import
token = CHANGE_ME_GARMIN_EDGE_TOKEN
# device_id = 1
source = /run/user/1000/gvfs/mtp:host=*/Garmin/[Aa]ctivit*
source = /run/user/1000/gvfs/mtp:host=*/*/Garmin/[Aa]ctivit*
include_glob = *.fit
skip_modified_recent_min = 5
max_age_days = 30

[columbus-p1]
# The P-1 Mark II shows up as a USB mass storage drive, automounted by the
# desktop under /run/media/<your-uid>/<volume>/ (or /media/<your-uid>/).
# The whole volume is scanned recursively; narrow the pattern once you know
# the folder the device writes its logs to (verify with --dry-run --verbose).
url = http://localhost:8080/api/v1/gpx/import
token = CHANGE_ME_COLUMBUS_P1_TOKEN
# device_id = 2
source = /run/media/1000/*
include_glob = *.gpx
skip_modified_recent_min = 5
max_age_days = 30
