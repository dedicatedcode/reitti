name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Maven
        uses: ./.github/actions/setup-maven
        with:
          seed: 'false'

      - name: Install dependencies for acknowledgments script
        run: |
          sudo apt-get update                                                                                                                                                                                                                                                         
          sudo apt-get install -y jq curl                                                                                                                                                                                                                                             

      - name: Generate acknowledgments data
        run: |
          chmod +x scripts/generate-acknowledgments.sh                                                                                                                                                                                                                                
          ./scripts/generate-acknowledgments.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build JAR without tests
        run: mvn compile package -DskipTests

      - name: Create bundle
        run: mkdir staging && cp target/*.jar staging

      - name: Upload JAR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: jar-artifact
          path: staging/
          retention-days: 1

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Maven
        id: setup
        uses: ./.github/actions/setup-maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run unit tests
        run: mvn test
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          SPRING_PROFILES_ACTIVE: test,ci

      - name: Upload coverage reports as artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            target/site/jacoco/
          retention-days: 30

      - name: Save shared Maven cache
        uses: ./.github/actions/save-maven-cache
        with:
          key: ${{ steps.setup.outputs.cache-key }}